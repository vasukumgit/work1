apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: vasudockerhub1/myone:backend-v3
        imagePullPolicy: Always

        ports:
        - containerPort: 5050

        env:
        - name: DB_HOST
          value: mysql-service

        - name: DB_PORT
          value: "3306"

        - name: DB_NAME
          value: stackly_db

        - name: DB_USER
          value: root

        - name: DB_PASSWORD
          value: root123
